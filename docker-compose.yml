services:
  # Skinlytics AgeVision AI — Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SDNEXT_URL=http://sdnext:7860
      - SDNEXT_AUTH_USER=
      - SDNEXT_AUTH_PASS=
    depends_on:
      sdnext:
        condition: service_healthy
    restart: unless-stopped

  # SD.Next — AI Image Generation Server
  # Requires NVIDIA GPU + nvidia-container-toolkit installed on host
  sdnext:
    build:
      context: ./sdnext
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - sdnext-data:/app/models
      - sdnext-outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["--api", "--listen", "--docs", "--insecure"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/sdapi/v1/progress"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  sdnext-data:
  sdnext-outputs:
